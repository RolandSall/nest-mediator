version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nest-mediator-postgres
    environment:
      POSTGRES_USER: mediator
      POSTGRES_PASSWORD: mediator123
      POSTGRES_DB: mediator_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediator -d mediator_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
