services:
  db:
    image: postgres:16-alpine
    container_name: nest-mediator-source-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source_example
    ports:
      - "5434:5432"
    volumes:
      - source_pgdata:/var/lib/postgresql/data

volumes:
  source_pgdata:
